[package]
name = "dashboard"
version = "0.1.5"
description = "A Tauri App"
authors = ["Rinibr"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "dashboard"

[features]
default = []
device-discovery = []
hevc-export = ["minimp4", "scuffle-h265"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "dashboard"
path = "src/main.rs"

[[bin]]
name = "ffmpeg-silent"
path = "src/bin/ffmpeg_silent.rs"

[[bin]]
name = "ffmpeg-silent-launcher"
path = "src/bin/ffmpeg_silent_launcher.rs"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.8.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-shell = "2.3.1"
tauri-plugin-updater = "2.9.0"
tauri-plugin-process = "2.3.1"
tokio = { version = "1", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
aes-gcm = "0.10.3"
base64 = "0.22.1"
sysinfo = "0.28"
pnet_datalink = "0.35.0"
get_if_addrs = "0.5.3"
dirs-next = "2.0.0"
chrono = { version = "0.4", features = ["serde"] }
yaserde = "0.8"
url = "2.3.1"
regex = "1.10"
reqwest = { version = "0.11", features = ["blocking", "json"] }
urlencoding = "2.1"
futures-util = "0.3"
webrtc = "0.9"
once_cell = "1.0"
rtp = "0.9"
serde_yaml = "0.9"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"
zip = "0.6"
minimp4 = { version = "0.1.2", optional = true }
scuffle-h265 = { version = "0.2.2", optional = true }
ssh2 = { version = "0.9", default-features = false, features = ["vendored-openssl"] }
libc = "0.2"
parking_lot = "0.12"
ort = { version = "2.0.0-rc.10", default-features = false, features = ["load-dynamic", "directml"] }
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
ndarray = "0.15"
thiserror = "1.0"
itertools = "0.12"
flate2 = { version = "1.0", features = ["miniz_oxide"] }
tar = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
lazy_static = "1.4"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
ipconfig = "0.3"
dirs = "5.0"
sha1 = "0.10"
