[package]
name = "dashboard"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.8.5", features = [] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-shell = "2.3.1"
tokio = { version = "1", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
aes-gcm = "0.10.3"
base64 = "0.22.1"
sysinfo = "0.30"
pnet_datalink = "0.35.0"
get_if_addrs = "0.5.3"
dirs-next = "2.0.0"
chrono = { version = "0.4", features = ["serde"] }
yaserde = "0.8"
url = "2.3.1"
regex = "1.10"
reqwest = { version = "0.11", features = ["blocking", "json"] }
urlencoding = "2.1"
futures-util = "0.3"
webrtc = "0.9"
once_cell = "1.0"
rtp = "0.9"
serde_yaml = "0.9"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"
