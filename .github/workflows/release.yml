name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.4.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtmultimedia'

      - name: Configure CMake
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$env:Qt6_DIR

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare Release Package
        shell: pwsh
        run: |
          mkdir release_pack
          copy build/appOpenIPC-Dashboard.exe release_pack/
          # Copy DLLs
          if (Test-Path build/*.dll) { copy build/*.dll release_pack/ }
          # Copy plugins folder
          if (Test-Path build/plugins) { xcopy build/plugins release_pack/plugins /E /I }
          # Copy OpenIPC QML module
          xcopy build/OpenIPC release_pack/OpenIPC /E /I
  
      - name: Zip Artifacts
        run: Compress-Archive -Path release_pack/* -DestinationPath OpenIPC-Dashboard-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: OpenIPC-Dashboard-Windows.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libvlc-dev libvlccore-dev pkg-config

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.4.2'
          host: 'linux'
          target: 'desktop'
          modules: 'qtmultimedia'

      - name: Install libxcb dependencies
        run: sudo apt-get install -y libxcb-cursor0

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare Release Package
        run: |
          mkdir release_pack_linux
          cp build/appOpenIPC-Dashboard release_pack_linux/
          # Copy .so libs if any exist in build output
          cp build/*.so* release_pack_linux/ || true
          # Copy plugins if any
          if [ -d "build/plugins" ]; then cp -r build/plugins release_pack_linux/; fi
          # Copy OpenIPC QML module
          cp -r build/OpenIPC release_pack_linux/
          
          # Create start script
          echo '#!/bin/bash' > release_pack_linux/run.sh
          echo 'export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(dirname "$0")' >> release_pack_linux/run.sh
          echo './appOpenIPC-Dashboard' >> release_pack_linux/run.sh
          chmod +x release_pack_linux/run.sh
          
          tar -czvf OpenIPC-Dashboard-Linux.tar.gz -C release_pack_linux .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: OpenIPC-Dashboard-Linux.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
      
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            OpenIPC-Dashboard-Windows.zip
            OpenIPC-Dashboard-Linux.tar.gz
