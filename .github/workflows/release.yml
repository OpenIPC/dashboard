name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag_name: ${{ steps.create-release.outputs.tag }}
    steps:
      - name: create release draft
        id: create-release
        uses: actions/github-script@v7
        env:
          MANUAL_TAG: ${{ inputs.version }}
        with:
          script: |
            const manualTag = process.env.MANUAL_TAG ? process.env.MANUAL_TAG.trim() : ''
            const inferredTag = context.ref ? context.ref.split('/').pop() : ''
            const tag = manualTag || inferredTag

            if (!tag) {
              core.setFailed('Unable to determine release tag name.')
              return
            }

            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Dashboard for OpenIPC ${tag}`,
              body: 'See the assets to download this version and install.',
              draft: true,
              prerelease: false
            })

            core.setOutput('tag', release.data.tag_name)
            return release.data.id

  build-windows:
    runs-on: windows-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm ci

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: download go2rtc binaries
        run: python tools/download-go2rtc.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: download ffmpeg binaries
        run: python tools/download-ffmpeg.py

      - name: build helper binaries
        run: |
          cd src-tauri
          
          # Create dummy files to satisfy tauri-build resource check
          echo "Creating dummy binaries..."
          New-Item -ItemType File -Force -Path binaries/ffmpeg-silent-launcher.exe
          New-Item -ItemType File -Force -Path binaries/ffmpeg-silent.exe
          
          echo "Building binaries..."
          cargo build --release --bin ffmpeg-silent-launcher --bin ffmpeg-silent
          
          echo "Copying real binaries..."
          if (Test-Path target/release/ffmpeg-silent-launcher.exe) {
            Copy-Item target/release/ffmpeg-silent-launcher.exe binaries/ -Force
            Copy-Item target/release/ffmpeg-silent.exe binaries/ -Force
          } elseif (Test-Path target/x86_64-pc-windows-msvc/release/ffmpeg-silent-launcher.exe) {
            Copy-Item target/x86_64-pc-windows-msvc/release/ffmpeg-silent-launcher.exe binaries/ -Force
            Copy-Item target/x86_64-pc-windows-msvc/release/ffmpeg-silent.exe binaries/ -Force
          } else {
            echo "Error: Built binaries not found in target directory"
            Get-ChildItem target -Recurse
            exit 1
          }

      - name: lint frontend (continue on error)
        run: npm run lint
        continue-on-error: true

      - name: Clean target directory
        run: Remove-Item -Recurse -Force src-tauri/target -ErrorAction SilentlyContinue

      - name: Write signing key
        id: write-key
        run: |
          const fs = require('fs');
          const path = require('path');
          
          const keyBase64 = process.env.SECRET_KEY;
          if (!keyBase64) {
            console.error('ERROR: SECRET_KEY env var is empty!');
            process.exit(1);
          }

          const rawContent = Buffer.from(keyBase64, 'base64').toString('utf-8');
          
          // Split into lines and filter out empty ones
          const lines = rawContent.split(/\r?\n/).filter(line => line.trim().length > 0);
          
          if (lines.length < 2) {
             console.error('ERROR: Key file must have at least 2 lines (comment and key)');
             console.log('Content preview:', rawContent.substring(0, 50));
             process.exit(1);
          }

          // Reconstruct strictly: Comment + CRLF + Key (no trailing newline)
          // Windows tools often require CRLF to detect line breaks correctly
          // And Minisign is sensitive to trailing whitespace/newlines
          const cleanContent = lines[0].trim() + '\r\n' + lines[1].trim();

          const keyPath = path.resolve('private.key');
          fs.writeFileSync(keyPath, cleanContent);
          
          console.log('Private key written to: ' + keyPath);
          console.log('Key length: ' + cleanContent.length);
          
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `key_path=${keyPath}\n`);
        env:
          SECRET_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        shell: node {0}

      - name: Inspect key file (debug)
        run: Format-Hex private.key

      - name: build Tauri app
        run: npx tauri build --verbose
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.write-key.outputs.key_path }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Manually sign artifacts (fallback)
        run: |
          $keyPath = "${{ steps.write-key.outputs.key_path }}"
          $msiDir = "src-tauri/target/release/bundle/msi"
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          
          function Sign-Artifacts($dir, $ext) {
            if (Test-Path $dir) {
              Get-ChildItem $dir -Filter "*$ext" | ForEach-Object {
                $file = $_.FullName
                $sigFile = "$file.sig"
                if (-not (Test-Path $sigFile)) {
                  Write-Host "Manual signing required for: $file"
                  # Use tauri signer directly
                  # Note: tauri signer uses TAURI_PRIVATE_KEY_PASSWORD (not SIGNING_...)
                  npx tauri signer sign -f $keyPath $file
                  if (Test-Path $sigFile) {
                    Write-Host "Successfully signed: $file"
                  } else {
                    Write-Error "Failed to sign: $file"
                  }
                } else {
                  Write-Host "Signature already exists for: $file"
                }
              }
            }
          }

          Sign-Artifacts $msiDir ".msi"
          Sign-Artifacts $nsisDir ".exe"
        env:
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: generate updater json
        run: node tools/generate_updater_json.js ${{ needs.create-release.outputs.tag_name }}

      - name: upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: src-tauri/target/release/bundle

      - name: attach installer to draft release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: |
            latest.json
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/**/*.exe
