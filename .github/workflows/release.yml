name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          version: 12.2.0

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.4.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtmultimedia'

      - name: Configure CMake
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$env:Qt6_DIR

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare Distribution Folder
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build/appOpenIPC-Dashboard.exe -Destination dist/
          
          # Copy DLLs
          if (Test-Path build/*.dll) { 
            Copy-Item build/*.dll -Destination dist/ -Force
          }
          
          # Copy plugins folder
          if (Test-Path build/plugins) { 
            Copy-Item build/plugins -Destination dist/ -Recurse -Force
          }
          
          # Copy OpenIPC QML module
          if (Test-Path build/OpenIPC) {
            Copy-Item build/OpenIPC -Destination dist/ -Recurse -Force
          }

      - name: Install Inno Setup
        run: choco install innosetup

      - name: Update Installer Version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          (Get-Content setup.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion ""$version""" | Set-Content setup.iss

      - name: Build Installer
        run: iscc setup.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: OpenIPC-Dashboard-Installer.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libvlc-dev libvlccore-dev pkg-config libfuse2 imagemagick

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.4.2'
          host: 'linux'
          target: 'desktop'
          modules: 'qtmultimedia'

      - name: Install libxcb dependencies
        run: sudo apt-get install -y libxcb-cursor0

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Helper - Create Desktop File
        run: |
          echo "[Desktop Entry]" > appOpenIPC-Dashboard.desktop
          echo "Type=Application" >> appOpenIPC-Dashboard.desktop
          echo "Name=OpenIPC Dashboard" >> appOpenIPC-Dashboard.desktop
          echo "Exec=appOpenIPC-Dashboard" >> appOpenIPC-Dashboard.desktop
          echo "Icon=openipc-dashboard" >> appOpenIPC-Dashboard.desktop
          echo "Categories=Utility;" >> appOpenIPC-Dashboard.desktop

      - name: Create AppImage
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Download linuxdeployqt
          wget https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage
          
          # Prepare AppDir
          mkdir -p AppDir/usr/bin
          cp build/appOpenIPC-Dashboard AppDir/usr/bin/
          
          # Prepare Icon (Convert .ico to .png)
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps/
          convert resources/appicon.ico -resize 256x256 AppDir/usr/share/icons/hicolor/256x256/apps/openipc-dashboard.png
          
          # Copy desktop file
          mkdir -p AppDir/usr/share/applications/
          cp appOpenIPC-Dashboard.desktop AppDir/usr/share/applications/
          
          # Copy extra assets (OpenIPC QML module) - linuxdeployqt might NOT handle this automatically if not in standard locations
          # We need to manually place QML modules if they are custom.
          # For custom QML modules located in build/OpenIPC, we need to instruct linuxdeployqt to find them or copy them to Qt qml dir.
          # A safer bet for custom QML is to copy them into the AppDir or configure QML_IMPORT_PATH.
          # Let's try copying to AppDir QML location and setting QML2_IMPORT_PATH?
          # Actually, linuxdeployqt has a -qmldir option.
          
          # Run linuxdeployqt
          # We point to the desktop file in AppDir
          # We use -unsupported-allow-new-glibc because we are on 22.04
          # -qmldir=... tells it where to scan for QML dependencies (our source + build)
          
          ./linuxdeployqt-continuous-x86_64.AppImage AppDir/usr/share/applications/appOpenIPC-Dashboard.desktop \
            -appimage \
            -unsupported-allow-new-glibc \
            -qmldir=src \
            -qmldir=build/OpenIPC \
            -extra-plugins=iconengines,imageformats
            
      - name: Rename AppImage
        run: mv OpenIPC_Dashboard-*.AppImage OpenIPC-Dashboard-Linux.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: OpenIPC-Dashboard-Linux.AppImage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: OpenIPC-Dashboard-Linux.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
      
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            OpenIPC-Dashboard-Windows.zip
            OpenIPC-Dashboard-Linux.tar.gz
