# .github/workflows/release.yml

name: Build & Release Cross-Platform

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ЭТАП 1: СБОРКА АРТЕФАКТОВ
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        version_type: [lite, intellect]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: List files for debugging
        run: ls -R

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Setup Python
        if: matrix.version_type == 'intellect'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Clean extra/analytics directory
        if: matrix.version_type == 'intellect'
        run: rm -rf extra/analytics
        shell: bash

      - name: Download UPX (Linux only)
        if: matrix.os == 'ubuntu-latest' && matrix.version_type == 'intellect'
        run: |
          curl -LO https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-amd64_linux.tar.xz
          tar -xf upx-4.2.1-amd64_linux.tar.xz
      - name: Disable UPX for PyInstaller (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.version_type == 'intellect'
        run: mv upx-4.2.1-amd64_linux/upx upx-4.2.1-amd64_linux/upx.disabled
        shell: bash
      - name: Download UPX (Windows only)
        if: matrix.os == 'windows-latest' && matrix.version_type == 'intellect'
        run: |
          Invoke-WebRequest -Uri https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-win64.zip -OutFile upx-4.2.1-win64.zip
          Remove-Item -Recurse -Force upx-4.2.1-win64 -ErrorAction SilentlyContinue
          Expand-Archive upx-4.2.1-win64.zip -DestinationPath $env:TEMP -Force
          Copy-Item "$env:TEMP\upx-4.2.1-win64" . -Recurse -Force
          Remove-Item "$env:TEMP\upx-4.2.1-win64" -Recurse -Force
        shell: powershell
      - name: Disable UPX for PyInstaller (Windows)
        if: matrix.os == 'windows-latest' && matrix.version_type == 'intellect'
        run: mv upx-4.2.1-win64/upx.exe upx-4.2.1-win64/upx.disabled.exe
        shell: powershell
      - name: Build Python analytics executables
        if: matrix.version_type == 'intellect'
        run: python ./python_src/build_analytics.py

      - name: Enable UPX (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.version_type == 'intellect'
        run: mv upx-4.2.1-amd64_linux/upx.disabled upx-4.2.1-amd64_linux/upx
        shell: bash
      - name: Enable UPX (Windows)
        if: matrix.os == 'windows-latest' && matrix.version_type == 'intellect'
        run: mv upx-4.2.1-win64/upx.disabled.exe upx-4.2.1-win64/upx.exe
        shell: powershell
      - name: Compress analytics executables with UPX (Linux only)
        if: matrix.os == 'ubuntu-latest' && matrix.version_type == 'intellect'
        run: |
          ./upx-4.2.1-amd64_linux/upx --lzma extra/analytics/analytics_cpu
      
      - name: Compress analytics executables with UPX (Windows only)
        if: matrix.os == 'windows-latest' && matrix.version_type == 'intellect'
        run: |
          ./upx-4.2.1-win64/upx.exe --lzma --force extra/analytics/analytics_cpu.exe
          ./upx-4.2.1-win64/upx.exe --lzma --force extra/analytics/analytics_dml.exe
      
      - name: List built analytics files (for debugging)
        if: matrix.version_type == 'intellect' && runner.os == 'Linux'
        run: ls -R extra/analytics
      - name: List built analytics files (for debugging, Windows)
        if: matrix.version_type == 'intellect' && runner.os == 'Windows'
        run: dir extra\analytics /s
        shell: cmd

      - name: Build and package Electron app (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:${{ matrix.version_type }} -- --linux --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Build and package Electron app (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:${{ matrix.version_type }} -- --win --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download UPX for installers (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -LO https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-amd64_linux.tar.xz
          tar -xf upx-4.2.1-amd64_linux.tar.xz

      - name: Compress installers with UPX (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "Looking for installers in dist/ to compress with UPX"
          set -e
          if [ -d dist ]; then
            # compress AppImage and any other executables found in dist
            find dist -type f \( -name '*.AppImage' -o -perm /111 \) -print0 | while IFS= read -r -d $'\0' file; do
              echo "Compressing: $file"
              ./upx-4.2.1-amd64_linux/upx --best --lzma "$file" || echo "UPX failed on $file"
            done
          else
            echo "No dist directory found, skipping installer compression"
          fi

      - name: Download UPX for installers (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Invoke-WebRequest -Uri https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-win64.zip -OutFile upx-4.2.1-win64.zip
          Expand-Archive upx-4.2.1-win64.zip -DestinationPath .
        shell: powershell

      - name: Compress installers with UPX (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Write-Host 'Compressing windows installers in dist\ with upx'
          if (Test-Path dist) {
            Get-ChildItem -Path dist -Recurse -File -Include *.exe,*.msi | ForEach-Object {
              Write-Host "Compressing: $($_.FullName)"
              try { & .\upx-4.2.1-win64\upx.exe --best --lzma $_.FullName } catch { Write-Warning "UPX failed on $($_.FullName): $_" }
            }
          } else { Write-Warning 'No dist folder found; skipping UPX for installers' }
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.version_type }}-build
          path: dist/

  # ЭТАП 2: СОЗДАНИЕ РЕЛИЗА
  create_release:
    needs: build 
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List downloaded files (before cleanup)
        run: ls -R artifacts/

      - name: Prepare release assets
        run: |
          mkdir release_assets
          find artifacts \( -name '*Setup*.exe' -o -name '*Portable*.exe' -o -name '*.AppImage' -o -name 'latest*.yml' -o -name 'mediamtx*' \) -exec cp {} release_assets/ \;
          find artifacts \( -name 'mediamtx' \) -exec cp {} release_assets/ \;
      
      - name: List final release assets (after cleanup)
        run: ls -R release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}