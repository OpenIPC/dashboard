name: Build and Test

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build for (all, windows, linux, macos)'
        required: false
        default: 'all'
        type: choice
        options:
        - all
        - windows
        - linux
        - macos

jobs:
  build-windows:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm install

      - name: lint frontend
        run: npm run lint
        continue-on-error: true

      - name: build frontend
        run: npm run build

      - name: download MediaMTX binaries
        run: python tools/download-mediamtx.py

      - name: test Rust code
        working-directory: src-tauri
        run: cargo test

      - name: build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install

      - name: lint frontend
        run: npm run lint
        continue-on-error: true

      - name: build frontend
        run: npm run build

      - name: download MediaMTX binaries
        run: python tools/download-mediamtx.py

      - name: test Rust code
        working-directory: src-tauri
        run: cargo test

      - name: build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: install frontend dependencies
        run: npm install

      - name: lint frontend
        run: npm run lint
        continue-on-error: true

      - name: build frontend
        run: npm run build

      - name: download MediaMTX binaries
        run: python tools/download-mediamtx.py

      - name: test Rust code
        working-directory: src-tauri
        run: cargo test

      - name: build Tauri app (ARM64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: '--target aarch64-apple-darwin'